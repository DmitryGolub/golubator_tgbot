global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://bot:8080/health
          - http://celery_worker:8081/health
          - http://celery_beat:8082/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
      - source_labels: [__param_target]
        regex: http://([^:/]+).*
        target_label: service

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: bot-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - bot:8080
          - celery_worker:8081
          - celery_beat:8082
    relabel_configs:
      - source_labels: [__address__]
        regex: ([^:]+).*
        target_label: service
