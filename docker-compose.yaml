x-app: &app-base
  build: .
  image: golubator-tgbot:latest
  env_file:
    - .env
  environment:
    DB_HOST: db
    REDIS_HOST: redis
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: tg_bot.db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tg_bot.redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrations:
    <<: *app-base
    container_name: tg_bot.migrations
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app-base
    container_name: tg_bot.bot
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery_worker:
    <<: *app-base
    container_name: tg_bot.celery_worker
    command: ["python", "-m", "src.scripts.celery_worker"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "src.celery_app", "inspect", "ping", "--timeout", "10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery_beat:
    <<: *app-base
    container_name: tg_bot.celery_beat
    command: ["python", "-m", "src.scripts.celery_beat"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "src/scripts/healthcheck_beat.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana-oss:11.5.2
    container_name: tg_bot.grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SERVER_ENABLE_GZIP: "true"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Test profile ──
  db_test:
    image: postgres:16-alpine
    container_name: tg_bot.db_test
    environment:
      POSTGRES_DB: botdb_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d botdb_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - test

  redis_test:
    image: redis:7-alpine
    container_name: tg_bot.redis_test
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - test

  migrations_test:
    <<: *app-base
    container_name: tg_bot.migrations_test
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.test
    environment:
      DB_HOST: db_test
      DB_PORT: 5432
      REDIS_HOST: redis_test
      REDIS_PORT: 6379
    restart: "no"
    depends_on:
      db_test:
        condition: service_healthy
    profiles:
      - test

  bot_test:
    <<: *app-base
    container_name: tg_bot.bot_test
    env_file:
      - .env.test
    environment:
      DB_HOST: db_test
      DB_PORT: 5432
      REDIS_HOST: redis_test
      REDIS_PORT: 6379
    depends_on:
      migrations_test:
        condition: service_completed_successfully
      redis_test:
        condition: service_healthy
    profiles:
      - test

  celery_worker_test:
    <<: *app-base
    container_name: tg_bot.celery_worker_test
    command: ["python", "-m", "src.scripts.celery_worker"]
    env_file:
      - .env.test
    environment:
      DB_HOST: db_test
      DB_PORT: 5432
      REDIS_HOST: redis_test
      REDIS_PORT: 6379
    depends_on:
      migrations_test:
        condition: service_completed_successfully
      redis_test:
        condition: service_healthy
    profiles:
      - test

  celery_beat_test:
    <<: *app-base
    container_name: tg_bot.celery_beat_test
    command: ["python", "-m", "src.scripts.celery_beat"]
    env_file:
      - .env.test
    environment:
      DB_HOST: db_test
      DB_PORT: 5432
      REDIS_HOST: redis_test
      REDIS_PORT: 6379
    depends_on:
      migrations_test:
        condition: service_completed_successfully
      redis_test:
        condition: service_healthy
    profiles:
      - test

  ngrok:
    image: ngrok/ngrok:latest
    container_name: tg_bot.ngrok
    command: http bot:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      bot:
        condition: service_healthy
    profiles:
      - dev
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  grafana_data:
  db_test_data:
