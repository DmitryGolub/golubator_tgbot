x-app: &app-base
  image: golubator-tgbot:latest
  env_file:
    - .env
  environment:
    DB_HOST: db
    REDIS_HOST: redis
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: tg_bot.db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tg_bot.redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrations:
    <<: *app-base
    container_name: tg_bot.migrations
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app-base
    build: .
    container_name: tg_bot.bot
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery_worker:
    <<: *app-base
    container_name: tg_bot.celery_worker
    command: ["python", "-m", "src.scripts.celery_worker"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery_beat:
    <<: *app-base
    container_name: tg_bot.celery_beat
    command: ["python", "-m", "src.scripts.celery_beat"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
