server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: ${LOKI_TENANT_ID}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - tg_bot.bot
              - tg_bot.celery_worker
              - tg_bot.celery_beat

    relabel_configs:
      # Extract service name from container name (strip "tg_bot." prefix)
      - source_labels: ["__meta_docker_container_name"]
        regex: '/tg_bot\.(.*)'
        target_label: service

    pipeline_stages:
      - docker: {}
      - match:
          selector: '{service=~"bot|celery_worker|celery_beat"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: name
                  message: message
                  telegram_id: telegram_id
                  elapsed_ms: elapsed_ms
                  action: action
      - labels:
          level:
